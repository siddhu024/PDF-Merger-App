<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Merger</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>PDF Merger</h2>

        <!-- This replaces your input() logic -->
        <form action="/merge" method="post" enctype="multipart/form-data">
            
            <p>Select PDF's that you want to merge: </p>
            
            <input type="file" name="pdfs" accept=".pdf" multiple required>
            
            <br><br>
            
            <button type="submit">Merge PDFs</button>
        </form>
    </div>

</body>
</html>
